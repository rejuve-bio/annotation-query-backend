name: annotation-query-backend-prod

# Production compose file.
#
# Differences from docker-compose.yml (the dev file):
#  - No ".:/app" bind mount. Code is baked into the image at build time
#    (Dockerfile's "COPY . ." + non-root USER), so a compromised app
#    process can no longer read arbitrary files off the host repo
#    (including .env) just by walking the shared filesystem — the
#    container only sees what was baked into its own image layer.
#  - Runs the image that was already built, scanned and pushed by CI
#    (no local "build:" section), so what's running here is the exact
#    artifact that went through the pipeline, not a fresh local build.
#  - Secrets are passed via env_file so the compose file itself carries
#    no values, and a real deployment can swap in a secrets manager
#    (Docker secrets / Vault / SOPS) without touching this file's shape.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d

services:
  annotation_service:
    image: "${DOCKER_HUB_REPO}"
    volumes:
      - /mnt/hdd_1:/mnt/hdd_1:ro
      - /dev/shm:/dev/shm
    ports:
      - "127.0.0.1:${APP_PORT}:${APP_PORT}"
    command: gunicorn app.main:socket_app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:${APP_PORT}
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g
    depends_on:
      - mongodb
      - redis
    env_file:
      - .env.production

  celery_worker_fast:
    image: "${DOCKER_HUB_REPO}"
    volumes:
      - /mnt/hdd_1:/mnt/hdd_1:ro
      - /dev/shm:/dev/shm
    command: celery -A app.workers.celery_app worker -Q fast --loglevel=info --concurrency 16 --max-tasks-per-child 50
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g
    depends_on:
      - annotation_service
      - redis
      - mongodb
    env_file:
      - .env.production

  celery_worker_slow:
    image: "${DOCKER_HUB_REPO}"
    volumes:
      - /mnt/hdd_1:/mnt/hdd_1:ro
      - /dev/shm:/dev/shm
    command: celery -A app.workers.celery_app worker -Q slow --loglevel=info --concurrency 16 --max-tasks-per-child 50
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g
    depends_on:
      - annotation_service
      - redis
      - mongodb
    env_file:
      - .env.production

  mongodb:
    image: mongo:latest
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:${MONGODB_DOCKER_PORT}:27017"
    restart: always

  redis:
    container_name: annotation_redis
    image: redis:latest
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    ports:
      - "127.0.0.1:${REDIS_DOCKER_PORT:-6380}:6379"
    restart: always
    volumes:
      - redis_data:/data

  caddy:
    image: caddy:2.8
    ports:
      - "127.0.0.1:${CADDY_PORT}:${CADDY_PORT_FORWARD}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command: caddy reverse-proxy --from http://0.0.0.0:${CADDY_PORT} --to http://annotation_service:${APP_PORT}
    restart: always
    depends_on:
      - annotation_service

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: annotation_meilisearch
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    ports:
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set}
      MEILI_ENV: production
      MEILI_DB_PATH: /meili_data
      MEILI_HTTP_ADDR: 0.0.0.0:7700
    restart: always

volumes:
  mongo_data:
  redis_data:
  caddy_data:
  caddy_config:
  meilisearch_data:

networks:
  default:
    name: annotation-query-backend-prod
