services:
  annotation_service:
    image: "${DOCKER_HUB_REPO}"
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /mnt/hdd_1:/mnt/hdd_1:rw
      - /dev/shm:/dev/shm
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${APP_PORT}:${APP_PORT}"
    command: gunicorn app.main:socket_app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:${APP_PORT}
    restart: always
    depends_on:
      - mongodb
      - redis
    environment: &app_env
      MONGO_URI: ${MONGO_URI}
      APP_PORT: ${APP_PORT}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      REDIS_URL_BROKER: redis://redis:6379/1
      REDIS_EXPIRATION: 3600
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      FASTAPI_APP: "true"
      MORK_DATA_DIR: ${MORK_DATA_DIR:-/mnt/hdd_1/biocypher-kg/output/hsa/metta_out_v6}
      FLY_MORK_DATA_DIR: ${FLY_MORK_DATA_DIR:-/mnt/hdd_1/biocypher-kg/output/dmel/metta}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-annotation-query-backend}
      DEDUP_ENABLED: ${DEDUP_ENABLED:-true}

  celery_worker_fast:
    image: "${DOCKER_HUB_REPO}"
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /mnt/hdd_1:/mnt/hdd_1:rw
      - /dev/shm:/dev/shm
      - /var/run/docker.sock:/var/run/docker.sock
    command: celery -A app.workers.celery_app worker -Q fast --loglevel=info --concurrency 16 --max-tasks-per-child 50
    restart: always
    depends_on:
      - annotation_service
      - redis
      - mongodb
    environment:
      <<: *app_env
      C_FORCE_ROOT: "1"

  celery_worker_slow:
    image: "${DOCKER_HUB_REPO}"
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /mnt/hdd_1:/mnt/hdd_1:rw
      - /dev/shm:/dev/shm
      - /var/run/docker.sock:/var/run/docker.sock
    command: celery -A app.workers.celery_app worker -Q slow --loglevel=info --concurrency 16 --max-tasks-per-child 50
    restart: always
    depends_on:
      - annotation_service
      - redis
      - mongodb
    environment:
      <<: *app_env
      C_FORCE_ROOT: "1"

  mongodb:
    image: mongo:latest
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:${MONGODB_DOCKER_PORT}:27017"
    restart: always

  redis:
    container_name: annotation_redis
    image: redis:latest
    ports:
      - "127.0.0.1:${REDIS_DOCKER_PORT:-6380}:6379"
    restart: always
    volumes:
      - redis_data:/data

  caddy:
    image: caddy:latest
    ports:
      - "${CADDY_PORT}:${CADDY_PORT_FORWARD}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command: caddy reverse-proxy --from http://0.0.0.0:${CADDY_PORT} --to http://annotation_service:${APP_PORT}
    restart: always
    depends_on:
      - annotation_service

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: annotation_meilisearch
    ports:
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-your_master_key_here}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_DB_PATH: /meili_data
      MEILI_HTTP_ADDR: 0.0.0.0:7700
    restart: always

volumes:
  mongo_data:
  redis_data:
  caddy_data:
  caddy_config:
  meilisearch_data:

networks:
  default:
    name: annotation-query-backend
  