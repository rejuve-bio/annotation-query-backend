services:
  annotation_service:
    image: "${DOCKER_HUB_REPO}"
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - ${SCHEMA_DATA_VOLUME}:/shared/output
    ports:
      - "${APP_PORT}:${APP_PORT}"
    command: gunicorn app.main:socket_app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:${APP_PORT}
    restart: always
    depends_on:
      - mongodb
      - redis
    environment: &app_env
      MONGO_URI: ${MONGO_URI}
      APP_PORT: ${APP_PORT}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      REDIS_URL_BROKER: redis://redis:6379/1
      REDIS_EXPIRATION: 3600
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      FASTAPI_APP: "true"
    networks:
      - default
      - shared-network

  celery_worker:
    image: "${DOCKER_HUB_REPO}"
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    command: celery -A app.workers.celery_app worker --loglevel=info
    restart: always
    depends_on:
      - annotation_service
      - redis
      - mongodb
    environment:
      <<: *app_env
      C_FORCE_ROOT: "1"
    networks:
      - default

  mongodb:
    image: mongo:latest
    volumes:
      - mongo_data:/data/db
    ports:
      - "${MONGODB_DOCKER_PORT}:27017"
    restart: always
    networks:
      - default

  redis:
    image: redis:latest
    ports:
      - "6400:6379"
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - default

  caddy:
    image: caddy:latest
    ports:
      - "${CADDY_PORT}:${CADDY_PORT_FORWARD}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command: caddy reverse-proxy --from http://0.0.0.0:${CADDY_PORT} --to http://annotation_service:${APP_PORT}
    restart: always
    depends_on:
      - annotation_service
    networks:
      - default

  meilisearch:
    image: getmeili/meilisearch:latest
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-your_master_key_here}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_DB_PATH: /meili_data
      MEILI_HTTP_ADDR: 0.0.0.0:7700
    restart: always
    networks:
      - default

volumes:
  mongo_data:
  redis_data:
  caddy_data:
  caddy_config:
  meilisearch_data:
  shared_output:

networks:
  default:
    driver: bridge
  shared-network:
    driver: bridge
    name: annotation-shared-network